name = "breeze-sync"
main = "src/index.ts"
compatibility_date = "2026-09-23"
workers_dev = true

[vars]
JWT_ISSUER = "https://auth.example.invalid/"
JWT_AUDIENCE = "breeze-sync-staging"
JWT_JWKS_URL = "https://auth.example.invalid/.well-known/jwks.json"
ALLOWED_ORIGINS = ""

[[durable_objects.bindings]]
name = "SYNC"
class_name = "SyncAccount"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncAccount"]
