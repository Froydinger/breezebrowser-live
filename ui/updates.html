<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>What's New — Breeze</title>
  <script>
    // Apply theme before first paint (no flash), like the new-tab page.
    try {
      var t = window.breezeInternal && breezeInternal.theme;
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #f9f7f4; --bg-alt: #ffffff; --card: rgba(255,255,255,0.88); --text: #202026;
      --soft: rgba(32,32,38,0.72); --faint: rgba(32,32,38,0.42); --accent: #3aa6b9;
      --accent-strong: #25879a; --line: rgba(0,0,0,0.09); --shadow: 0 22px 70px rgba(24,34,38,0.12);
      --ease: cubic-bezier(0.22,1,0.36,1);
    }
    html.dark {
      --bg: #151618; --bg-alt: #1c1d21; --card: rgba(255,255,255,0.07); --text: #ececf0;
      --soft: rgba(236,236,240,0.62); --faint: rgba(236,236,240,0.34); --line: rgba(255,255,255,0.1);
      --shadow: 0 22px 70px rgba(0,0,0,0.28);
      color-scheme: dark;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background:
        radial-gradient(circle at 84% 6%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 34rem),
        linear-gradient(180deg, var(--bg-alt) 0%, var(--bg) 38%, var(--bg-alt) 100%);
      color: var(--text); min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 54px 24px 86px; transition: background 0.3s var(--ease);
      -webkit-font-smoothing: antialiased;
    }
    .wrap { width: min(880px, 100%); margin: 0 auto; }
    header { position: relative; margin-bottom: 42px; animation: rise 0.56s var(--ease); }
    header::before {
      content: ''; position: absolute; width: 180px; height: 180px; right: 4%; top: -20px;
      border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 18%, transparent), transparent 68%);
      transform: scale(0.7); opacity: 0; animation: bloom 0.8s var(--ease) 0.15s forwards, halo-drift 9s ease-in-out 1s infinite alternate; pointer-events: none;
    }
    header img { width: 46px; height: 46px; border-radius: 50%;
      filter: drop-shadow(0 10px 24px color-mix(in srgb, var(--accent) 35%, transparent)); margin-bottom: 24px;
      animation: mark-pop 0.62s var(--ease) 0.08s backwards, mark-float 5.6s ease-in-out 1s infinite; }
    header h1 {
      max-width: 720px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(46px, 8vw, 76px);
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: 0;
    }
    header p { color: var(--soft); font-size: 17px; line-height: 1.65; max-width: 680px; margin-top: 18px; }
    .now { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; font-size: 12px; font-weight: 800;
      letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, transparent);
      padding: 7px 12px; border-radius: 99px; }
    .now::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .rel {
      position: relative; display: grid; grid-template-columns: 116px 1fr; gap: 28px;
      padding: 30px 0; border-top: 1px solid var(--line); animation: rise 0.5s var(--ease) backwards;
    }
    .rel:nth-of-type(2) { animation-delay: 0.04s; }
    .rel:nth-of-type(3) { animation-delay: 0.08s; }
    .rel::before { content: none; }
    .ver { display: flex; flex-direction: column; align-items: flex-start; gap: 9px; color: var(--accent); }
    .ver b { font-size: 13px; font-weight: 800; letter-spacing: 0.02em; }
    .ver .tag { font-size: 10px; font-weight: 800; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent);
      padding: 3px 8px; border-radius: 99px; letter-spacing: 0.08em; text-transform: uppercase; }
    .rel h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 4.4vw, 36px);
      font-weight: 400; line-height: 1.12; letter-spacing: 0; margin-bottom: 14px;
    }
    ul { list-style: none; display: flex; flex-direction: column; gap: 9px; }
    li { font-size: 14.5px; line-height: 1.58; color: var(--soft); padding-left: 18px; position: relative; }
    li::before { content: ''; position: absolute; left: 1px; top: 0.75em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    li b { color: var(--text); font-weight: 600; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes bloom { to { opacity: 1; transform: scale(1); } }
    @keyframes mark-pop { from { opacity: 0; transform: translateY(8px) scale(0.82) rotate(-8deg); } to { opacity: 1; transform: none; } }
    @keyframes mark-float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
    @keyframes halo-drift { from { transform: translate(0,0) scale(1); } to { transform: translate(-22px,18px) scale(1.08); } }

    /* Hero card for the newest release */
    .hero {
      position: relative; overflow: hidden;
      border-radius: 18px; padding: 28px 30px 30px; margin-bottom: 48px;
      color: var(--text); background: var(--card); border: 1px solid var(--line);
      box-shadow: var(--shadow);
      animation: hero-pop 0.6s var(--ease) 0.06s backwards, hero-breathe 8s ease-in-out 1.2s infinite;
    }
    @keyframes hero-pop { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: none; } }
    @keyframes hero-breathe { 0%, 100% { box-shadow: var(--shadow); } 50% { box-shadow: 0 28px 84px color-mix(in srgb, var(--accent) 18%, transparent); } }
    .hero::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(105deg, transparent 34%, rgba(255,255,255,0.34) 50%, transparent 66%);
      transform: translateX(-120%); animation: hero-shine 6.5s var(--ease) 0.4s infinite;
    }
    @keyframes hero-shine { 0%, 58% { transform: translateX(-120%); } 82%, 100% { transform: translateX(120%); } }
    .hero-orb { position: absolute; border-radius: 50%; pointer-events: none; z-index: 0; opacity: 0; animation: orb-in 0.9s var(--ease) 0.18s forwards, orb-drift 7s ease-in-out 1s infinite alternate; }
    .hero-orb.o1 { width: 210px; height: 210px; top: -96px; right: -68px; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 25%, transparent), transparent 68%); }
    .hero-orb.o2 { width: 130px; height: 130px; bottom: -58px; left: -30px; background: radial-gradient(circle, color-mix(in srgb, #ffffff 90%, var(--accent)), transparent 70%); animation-direction: alternate-reverse; }
    @keyframes orb-in { from { opacity: 0; transform: scale(0.74); } to { opacity: 1; transform: scale(1); } }
    @keyframes orb-drift { from { translate: 0 0; } to { translate: -18px 14px; } }
    /* content sits above the orbs — scoped so the orbs stay absolutely placed */
    .hero-icon, .hero-pill, .hero-title, .hero-list { position: relative; z-index: 1; }
    .hero-icon {
      width: 58px; height: 58px; border-radius: 16px; margin-bottom: 18px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      box-shadow: 0 16px 34px color-mix(in srgb, var(--accent) 26%, transparent);
      animation: icon-pop 0.7s var(--ease) 0.15s backwards, icon-bob 4.2s ease-in-out 1.1s infinite;
    }
    .hero-icon svg { width: 33px; height: 33px; stroke: #fff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes icon-pop { 0% { opacity: 0; transform: scale(0.4) rotate(-12deg); } 60% { transform: scale(1.12) rotate(5deg); } 100% { opacity: 1; transform: none; } }
    @keyframes icon-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .hero-pill {
      display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
      padding: 6px 12px; border-radius: 99px; margin-bottom: 14px;
    }
    .hero-title {
      max-width: 640px; font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 5.2vw, 46px); line-height: 1.04; font-weight: 400; letter-spacing: 0; margin-bottom: 18px;
    }
    .hero-list { display: flex; flex-direction: column; gap: 10px; }
    .hero-list li { font-size: 14.5px; line-height: 1.58; color: var(--soft); padding-left: 18px; position: relative; }
    .hero-list li::before { content: ''; position: absolute; left: 1px; top: 0.75em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .hero-list li b { color: var(--text); font-weight: 700; }
    /* Compact treatment for one-fix patch releases. */
    .hotfix-card {
      display: grid; grid-template-columns: 44px 1fr; gap: 16px; align-items: start;
      border-radius: 16px; padding: 18px 20px; margin-bottom: 38px;
      color: var(--text); background: var(--card); border: 1px solid var(--line);
      box-shadow: 0 12px 36px rgba(24,34,38,0.09);
      animation: rise 0.45s var(--ease) backwards;
    }
    .hotfix-icon {
      width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px;
      color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent);
    }
    .hotfix-icon svg { width: 23px; height: 23px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .hotfix-meta { display: flex; align-items: center; gap: 9px; margin: 1px 0 6px; }
    .hotfix-pill { font-size: 10px; line-height: 1; font-weight: 850; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
    .hotfix-version { font-size: 11px; color: var(--faint); font-weight: 750; }
    .hotfix-title { font-family: Georgia, "Times New Roman", serif; font-size: 25px; line-height: 1.1; font-weight: 400; margin-bottom: 8px; }
    .hotfix-list { gap: 0; }
    .hotfix-list li { padding-left: 0; font-size: 14px; line-height: 1.52; }
    .hotfix-list li::before { content: none; }
    /* small icon chip on each past release */
    .rel-icon { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 9px;
      background: color-mix(in srgb, var(--accent) 12%, transparent); flex-shrink: 0; }
    .rel-icon svg { width: 13px; height: 13px; stroke: var(--accent); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .past-head { font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent); margin: 0 0 12px 2px; }
    .older-releases { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 20px; }
    .older-releases summary {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      cursor: pointer; list-style: none; padding: 14px 18px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--line); color: var(--text);
      font-size: 14px; font-weight: 750; margin-bottom: 24px; box-shadow: var(--shadow);
    }
    .older-releases summary::-webkit-details-marker { display: none; }
    .older-releases summary::after { content: '+'; color: var(--accent); font-size: 20px; line-height: 1; }
    .older-releases[open] summary::after { content: '-'; }
    .older-releases summary span { color: var(--soft); font-size: 12px; }
    @media (max-width: 620px) {
      body { padding: 36px 18px 64px; }
      .rel { grid-template-columns: 1fr; gap: 8px; padding: 26px 0; }
      .ver { flex-direction: row; align-items: center; }
      header h1 { font-size: clamp(40px, 14vw, 58px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

    const RELEASES = [
      { v: '5.6.2', icon: 'link', title: 'Links That Actually Open, And You Can See Them Load', hotfix: true, major: false, items: [
        '<b>“Open In Breeze” Links Work</b> — Clicking a link in Mail, Messages, Slack or anywhere else could hand Breeze the address and then show you nothing at all — a blank page, or a tab that never appeared. Those links open properly now, whether Breeze was already running or started up to take them.',
        '<b>What Was Wrong</b> — Breeze switched links to the secure <code>https://</code> address a moment too early, before the part of the browser that watches the connection could see it. That part is what notices a site has no secure version and retries — so it never got the chance, and the page simply dead-ended with nothing to fall back to.',
        '<b>No More Endless Bouncing</b> — A site that answers <code>https://</code> by sending you straight back to <code>http://</code> put Breeze in a loop, upgrading and getting bounced over and over while you stared at a blank page. Refreshing was the only way out. Breeze now spots the bounce the first time it happens and stops.',
        '<b>Sites Without Security Ask You First</b> — Breeze still tries the secure version of every address. When a site genuinely has no secure version, it no longer loads the unencrypted page behind your back or hangs waiting — you get a page that says so, with <b>Load anyway</b> if you still want it and <b>Try https again</b> if you think it should work.',
        '<b>A Loading Bar</b> — There was no way to tell a slow site from a stuck one. A thin bar now runs across the top of the page while it loads and disappears when it is done.',
        '<b>Breeze Stays Quick With Tabs Open</b> — Every open page is a separate chunk of memory, and a dozen of them could bog down the whole machine until you quit Breeze and started over. Background tabs you have not touched in a while now go to sleep once there are a lot of them, or the moment macOS says memory is tight. Opening one brings it back exactly where you left it, scroll position and history included — which sleeping tabs never used to do.' ] },

        '<b>You See Your Changes Now</b> — Refreshing a site you were working on could keep showing the old version long after you changed it, so you ended up checking your work in another browser. Refresh now asks the server about every file on the page, the way Safari does.',
        '<b>What Was Wrong</b> — Sites tell the browser how long it may reuse a file, and for scripts and stylesheets that is often hours. Breeze took that at its word on a refresh and never even asked whether the file had changed. It caught up eventually, which is what made it feel random. Files that genuinely have not changed still come back instantly, so refresh is no slower.',
        '<b>Reload Ignoring Cache</b> — Shift-click the reload button, or press ⇧⌘R, to throw away everything a site has stored locally and start clean — including a service worker, which can serve an old version of a site without the network being involved at all.',
        '<b>Clear Cache Reaches Further</b> — The trash button in the address bar now also clears what a site saved through its own caching, not just the browser cache, and refreshes the site icon so a changed favicon shows up straight away.' ] },
      { v: '5.6.0', icon: 'shield-check', title: 'A Shield In The Address Bar', hotfix: false, major: true, items: [
        '<b>Turn Blocking Off For One Site</b> — There is a shield in the address bar now. Click it and ad blocking switches off for the site you are on, and stays off for that site until you switch it back on. Every other site keeps blocking as normal.',
        '<b>Off Now Means Off</b> — Turning blocking off for a site only ever switched off the extra rules Breeze adds, while the main blocklist kept working in the background. That is why switching it off often seemed to do nothing. Off now means the whole thing, main blocklist included, and it covers subdomains of the site too.',
        '<b>It Takes Effect Right Away</b> — Turning blocking off used to leave the page you were looking at exactly as it was until you refreshed it yourself. The page reloads on its own now, so you see the change immediately.' ] },
      { v: '5.5.9', icon: 'link', title: 'Clicked Links Reach The Secure Site', hotfix: true, major: false, items: [
        '<b>Links Load Instead Of Erroring</b> — Clicking a link could dump you on a plain <code>http://</code> address and an error page, even though refreshing or typing the same address worked fine. Links go to the secure version of the site now, no matter how the link is built.',
        '<b>What Was Wrong</b> — Breeze upgraded links to <code>https://</code> only when it could see you click a normal link. Plenty of sites move you along with a script instead, and those arrived looking like something Breeze had deliberately been told not to touch — so they stayed on <code>http://</code> and dead-ended. Every page you open in a tab is upgraded now.',
        '<b>Sites Without Security Still Open</b> — The handful of sites that genuinely have no secure version used to fail outright, because macOS blocks plain <code>http://</code> unless an app asks otherwise. Breeze now tries the secure address first, and quietly falls back to the plain one if the site truly does not have it, rather than showing you an error.',
        '<b>No Loops</b> — If a site sends you back to <code>http://</code> on purpose, Breeze takes the hint and leaves it alone for the rest of the session instead of bouncing between the two. Local addresses and dev servers keep <code>http://</code> as before.' ] },
      { v: '5.5.8', icon: 'download', title: 'Save Videos From X, And Fullscreen That Fills The Screen', hotfix: true, major: false, items: [
        '<b>Download Videos On X</b> — Right-clicking a video on X gives you “Download Video” now, the same as on every other site. It saves the highest-quality version the post has.',
        '<b>Why It Never Worked</b> — Two things were in the way. X lays an invisible sheet over its videos to catch clicks, so a right-click never actually landed on the video and no video options appeared. And X streams video in pieces rather than as a single file, so even once found there was no file to save. Breeze now looks past the sheet and picks up the real video file X already lists for each post.',
        '<b>Fullscreen Works On X</b> — Going fullscreen on an X video left it stranded as a small box partway down the page instead of filling the screen. It fills the screen properly now, and your timeline is exactly where you left it when you come back.',
        '<b>The Same Fix Everywhere</b> — The cause was general, not an X quirk: a site can pin the page around a video in a way that made “fullscreen” measure against that spot on the page instead of your display. Breeze now clears that out for any site while fullscreen is open. Some players also ask for fullscreen through an older Safari-only route that skipped Breeze’s handling entirely and hit the broken macOS 27 path; those go through the working one now too.' ] },
      { v: '5.5.7', icon: 'shield-check', title: 'Fullscreen Everywhere, Links That Load, No More Crash', hotfix: true, major: false, items: [
        '<b>Fullscreen On Every Site</b> — The fullscreen fix from 5.5.5 only applied to YouTube. It now covers every site, so video fills the screen properly wherever you watch.',
        '<b>Links Reach The Site Again</b> — Opening a link that pointed at plain <code>http://</code> could dead-end on “This page couldn’t load.” Typing the same address in the URL bar worked, which made it look random. Breeze upgrades those links to <code>https://</code> now, however you open them — a link in another app, the context menu, a link that opens its own window, or a restored tab. Local addresses keep <code>http://</code>, so dev servers still work.',
        '<b>A Crash Fixed</b> — Breeze could quit outright when a page asked for two permissions at once, like location and camera together. The second prompt was being opened on top of the first in a way macOS refuses, and the app went down with it. Prompts now wait their turn.' ] },
      { v: '5.5.6', icon: 'keyboard', title: 'New Tabs Keep Your First Keystrokes', hotfix: true, major: false, items: [
        '<b>Type Straight Away</b> — Opening a new tab while a video was playing swallowed the first several characters you typed. The ask bar is ready the moment the tab appears now.',
        '<b>What Was Wrong</b> — Leaving a playing video pops it into Picture-in-Picture so it keeps going, and that little floating window quietly took the keyboard a beat after the new tab had already been handed it. Anything typed in between went nowhere. Breeze takes the keyboard straight back now.' ] },
      { v: '5.5.5', icon: 'play-circle', title: 'Fullscreen Video Actually Works', hotfix: true, major: false, items: [
        '<b>No More Blank Fullscreen</b> — Going fullscreen on a video could fill the screen with nothing: black in dark mode, white in light mode, with the audio still playing. Fullscreen now shows the video, every time.',
        '<b>It Keeps Working</b> — Fullscreen used to break for good after the first try, and only quitting and reopening Breeze would bring it back. It survives leaving and re-entering as many times as you like now.',
        '<b>The Player Responds Again</b> — Play, pause, scrub, and the rest of the on-screen controls stopped taking clicks in fullscreen, leaving Esc as the only way out. They work normally again.',
        '<b>What Was Wrong</b> — Two things. The page was never told the window had grown, so it kept drawing at the old size and painted its own background over the rest of the screen. And Breeze’s own way of hiding everything but the video could catch the video too once YouTube moved it, leaving it invisible and unclickable for the rest of the session.' ] },
      { v: '5.5.4', icon: 'shield-check', title: 'The Text-Box Crash, Actually Fixed', hotfix: true, major: false, items: [
        '<b>Really Fixed This Time</b> — Breeze could still quit when your pointer passed over a text box. The fix in 5.5.2 and 5.5.3 turned out to do nothing at all, so this replaces it with one that is verified to work.',
        '<b>What Was Wrong</b> — macOS 27 shows a writing-helper bubble over text boxes in every app. It is drawn by a separate part of the system, and on the macOS 27 beta that handoff fails and takes the app down with it. Breeze never asked for the bubble; the system adds it automatically.',
        '<b>How It Is Fixed</b> — Breeze now declines that bubble before the system can start building it, so the failure can never happen. Nothing else changes, and spelling and autocorrect still work normally.' ] },
      { v: '5.5.3', icon: 'play-circle', title: 'Fullscreen Video & Research Fixed', hotfix: true, major: false, items: [
        '<b>No More Black Fullscreen Video</b> — Fullscreen video could go black while the audio kept playing, on YouTube, Xbox Cloud Gaming, and anywhere else. Breeze now always squares off the window in fullscreen so the GPU’s hardware video overlay is never clipped.',
        '<b>One Less Way To Break It</b> — The “Smoother fullscreen video” toggle is gone. Turning it off was never really a style choice; it silently caused the black-video bug, so the fix is simply always on now. If you had it off, this repairs itself — nothing to change.',
        '<b>Research Actually Researches</b> — Asking Nav to research a topic could come back with “I’ll look into that…” or a question instead of real findings. Nav now goes straight to searching and reading sources.' ] },
      { v: '5.5.2', icon: 'shield-check', title: 'No More Text-Field Crashes', hotfix: true, major: false, items: [
        '<b>Google Meet Crash Fixed</b> — Breeze no longer quits when your pointer moves over a text box. Meet’s chat and name fields, and any other page with an input, are safe again.',
        '<b>The Real Cause</b> — macOS 27’s new Siri writing assistant draws its pop-up from a separate system process, and that handoff fails on the beta, taking the whole app down with it.',
        '<b>Web Pages Opt Out</b> — Breeze now tells Writing Tools to skip web content entirely, so the pop-up is never built. Spelling, autocorrect, and Writing Tools everywhere else on your Mac are unaffected.' ] },
      { v: '5.5.1', icon: 'key-round', title: 'Delete Keys Work Again', hotfix: true, major: false, items: [
        '<b>Web App Deletion Restored</b> — Backspace now reaches selected-item and custom delete controls in web apps that rely on the keyboard instead of a button or context menu.',
        '<b>No Accidental History Navigation</b> — Breeze still suppresses WebKit’s legacy Backspace-to-go-back behavior outside of text fields.' ] },
      { v: '5.5.0', icon: 'upload', title: 'Uploads Stay Open', hotfix: true, major: false, items: [
        '<b>YouTube Studio Upload Repair</b> — Choosing a video or thumbnail no longer crashes Breeze when YouTube Studio opens its file picker.',
        '<b>Stable Native File Pickers</b> — Website upload dialogs now detach WebKit’s transient text-input view before presenting from the active Breeze window, protecting uploads on macOS 27.' ] },
      { v: '5.4.3', icon: 'maximize', title: 'Social Media, Full Size', hotfix: true, major: false, items: [
        '<b>Threads Media Restored</b> — GIFs and other first-party feed media served by Threads now load normally while Breeze’s ad blocking remains active everywhere else.',
        '<b>X Fullscreen Restored</b> — X and other sites use native WebKit fullscreen again, avoiding the blank black player caused by applying the YouTube-specific workaround to their layered video surfaces.',
        '<b>YouTube Stays Protected</b> — Breeze keeps its proven in-window fullscreen path exclusively on YouTube, preserving the video-only fullscreen and pause/seek stability fixes.' ] },
      { v: '5.4.2', icon: 'zap', title: 'Subresource & Image Rendering Fix', hotfix: true, major: false, items: [
        '<b>Subresource Image & Media Rendering</b> — Fixed issue where embedded images, CDNs, and media subframes on social sites like Threads and Twitter could turn into blank boxes by ensuring subframe responses are never mistakenly routed to downloads.',
        '<b>Clean Navigation Flow</b> — Unified startup and new-tab navigation pipeline for fast, reliable page loading.' ] },
      { v: '5.4.1', icon: 'refresh-cw', title: 'Reliable Starts & Web Apps', hotfix: true, major: false, items: [
        '<b>First Load, First Time</b> — The launch tab stays on Breeze’s New Tab surface until its destination is ready, with a controlled retry and a real error page instead of a blank or <code>about:blank</code> result.',
        '<b>Google Photos Repair</b> — Existing profiles automatically repair stale Google Photos caches and service-worker data once, while preserving cookies, sign-ins, local storage, and photo-library access.',
        '<b>Web Apps Are Your Choice</b> — Installed Safari web apps no longer take over ordinary browsing. Breeze keeps the site in its tab and offers a dismissible “Open in App” banner instead.' ] },
      { v: '5.4.0', icon: 'zap', title: 'Downloads, Auth & Navigation', major: true, items: [
        '<b>Pages Stay Pages</b> — HTML, text, XML, JSON, and other displayable main-page responses now remain in the browser instead of being saved as <code>inner.html</code> downloads.',
        '<b>Native HTTP Authentication</b> — Protected staging sites, router panels, and local services can now request HTTP Basic or Digest credentials in a native sign-in prompt.',
        '<b>More Reliable First Navigation</b> — New-tab web views are attached and sized before their first request, reducing blank first loads when opening a URL or search.' ] },
      { v: '5.3.2', icon: 'maximize', title: 'The Video, Not the Tab', hotfix: true, major: false, items: [
        '<b>Video-Only Fullscreen</b> — YouTube document-level fullscreen requests now resolve visually to the active player instead of stretching the entire watch page across the screen.',
        '<b>Clean Player Surface</b> — Headers, recommendations, comments, and other page branches stay out of fullscreen while the player and its controls remain intact.',
        '<b>Compositor-Safe Isolation</b> — Breeze preserves the working 5.3.1 video surface path and never clips, reparents, transforms, or hides the player’s ancestor chain.' ] },
      { v: '5.3.1', icon: 'play', title: 'Fullscreen That Survives Pause', hotfix: true, major: false, items: [
        '<b>Pause Without Black Video</b> — On macOS 27, Breeze now avoids the WKWebView fullscreen transfer that could lose the hardware video surface after Space, pause, or seek while leaving audio and controls alive.',
        '<b>One Stable Video Surface</b> — The requested player fills the screen while its original WKWebView and compositor stay attached to the same Breeze window, eliminating the detach-and-reparent failure entirely.',
        '<b>Repeatable Fullscreen</b> — Double-click, Escape, repeated entry and exit, split tabs, and post-fullscreen Now Playing state all restore cleanly without disturbing Picture in Picture or older macOS versions.' ] },
      { v: '5.3.0', icon: 'maximize', title: 'Fullscreen, the Native Way', hotfix: false, major: true, items: [
        '<b>Reliable Video Fullscreen</b> — Breeze now leaves YouTube and other video fullscreen presentation entirely to WebKit, eliminating the custom CSS and window substitutions that could produce audio, captions, and controls over a black video surface.',
        '<b>Safe Repeated Transitions</b> — Fullscreen exit cleanup waits until WebKit has actually returned the live web view and ignores stale callbacks from earlier cycles, keeping the active tab and video renderer intact.',
        '<b>Stable Window Controls</b> — Traffic lights always return to one absolute calibrated position after fullscreen, preventing accumulated drift while moving the group three pixels left for cleaner alignment.',
        '<b>Polished Ask and Search Keys</b> — Return and Shift symbols now sit visually centered inside their compact New Tab keycaps.' ] },
      { v: '5.2.9', icon: 'download', title: 'An Update Prompt That Belongs', hotfix: true, major: false, items: [
        '<b>Native Mac Structure</b> — Update notices now use native AppKit typography, controls, keyboard defaults, and accessibility while staying safely inside the Breeze window.',
        '<b>Breeze Visual Language</b> — The compact centered card follows the active Breeze palette, accent, rounded surfaces, and dark mode instead of presenting a stretched gray panel.',
        '<b>Fullscreen-Safe</b> — The prompt still avoids creating a separate alert window, preserving the WebKit fullscreen and Picture in Picture crash protection added in 5.2.7.' ] },
      { v: '5.2.8', icon: 'refresh-cw', title: 'Pages Open Where They Belong', hotfix: true, major: false, items: [
        '<b>First Navigation Renders</b> — Typing a site into the top address bar from New Tab, Nav Chat, onboarding, or another Breeze page now opens the page on the first attempt instead of leaving a blank WebKit surface.',
        '<b>HTML Stays in the Browser</b> — Internal-to-web navigations are treated as display intent, so normal HTML renders in its tab instead of being mistakenly saved to Downloads.',
        '<b>Cleaner Fullscreen and PiP</b> — Fullscreen ownership is isolated from ordinary navigation and chrome updates, while Picture in Picture uses a smaller, more reliable state model.',
        '<b>Native Window Edges</b> — Web pages now run flush to the sidebar, right edge, and bottom edge so AppKit supplies the natural outer-window rounding without clipping WebKit.',
        '<b>Dark Internal Pages</b> — Onboarding and What’s New now initialize and update with Breeze’s active theme, with improved light-mode Tasks badge contrast.',
        '<b>Clear Ask and Search Keys</b> — New Tab and Nav Chat now show compact Return and Shift keycaps for Ask and Search instead of a Shortcuts link.' ] },
      { v: '5.2.7', icon: 'maximize', title: 'Tabs and Video Stay Put', hotfix: true, major: false, items: [
        '<b>Sleeping Tabs Keep Their Names</b> — Sleeping a tab now preserves its real title and site identity instead of fading into “New Tab” until it wakes.',
        '<b>Fullscreen Video Restored</b> — Breeze waits for macOS 27 to actually return the WebKit view after fullscreen, preventing black or white video surfaces during repeated fullscreen and PiP use.',
        '<b>Update Prompt Crash Fixed</b> — Update notices now appear inside the Breeze window instead of ordering a separate modal window that could crash AppKit ViewBridge during extended browsing sessions.' ] },
      { v: '5.2.6', icon: 'picture-in-picture', title: 'Stable Window Controls on macOS 27', hotfix: true, major: false, items: [
        '<b>PiP and Fullscreen Stability</b> — Breeze now leaves macOS 27 traffic-light layout to AppKit, preventing the controls from turning into a blank strip after Picture in Picture, fullscreen, or other window transitions.',
        '<b>Native Window Behavior</b> — Close, minimize, and zoom controls remain fully native and continue following the active-window state managed by macOS.' ] },
      { v: '5.2.5', icon: 'check-check', title: 'Steadier Editing on macOS 27', hotfix: true, major: false, items: [
        '<b>WordPress and Web Editors Stabilized</b> — Breeze now resigns WebKit text focus before switching, closing, or detaching tabs so delayed editor UI cannot target a stale view.',
        '<b>macOS 27 Autocorrection Crash Avoided</b> — Breeze temporarily disables the unstable automatic-correction popover on macOS 27 while preserving normal typing and editor behavior.',
        '<b>Traffic Lights Stay Aligned</b> — Window controls sit cleanly with the navigation row and return to that exact position after leaving fullscreen on macOS 27.' ] },
      { v: '5.2.4', icon: 'shield-check', title: 'Private Windows Truly Close', hotfix: true, major: false, items: [
        '<b>Long-Session Crash Fixed</b> — Closed browser windows no longer receive late tab, redirect, or WordPress editor URL updates that could crash Breeze while opening another tab.',
        '<b>Private Media Fully Released</b> — Closing a private tab or window now suspends its media, stops and blanks its web view, cancels downloads, and releases its non-persistent browsing session.',
        '<b>No Closed Windows Left Behind</b> — Breeze now removes closed window controllers, timers, observers, and other background work while safely handing shared tabs to any surviving normal window.' ] },
      { v: '5.2.3', icon: 'key-round', title: 'Editor Backspace and Auto-Focus', hotfix: true, major: false, items: [
        '<b>Backspace in Editors Restored</b> — The keyboard event listener now traverses shadow boundaries and checks iframe elements, resolving a bug that blocked the backspace key inside Gutenberg and other rich-text web editors.',
        '<b>Auto-Focused New Tabs</b> — Opening a new tab (via Command+T or clicking "+") now immediately focuses the ask/address input field so you can type without clicking.' ] },
      { v: '5.2.2', icon: 'picture-in-picture', title: 'Picture-in-Picture Restored and Polish', hotfix: true, major: false, items: [
        '<b>Native PiP Restore Repaired</b> — Clicking the native restore/return button on the floating PiP window now successfully exits PiP and returns focus back to the video tab.',
        '<b>Stabilized Background Tabs</b> — Web views for active PiP videos remain attached to the window hierarchy to support the native restore animation.',
        '<b>YouTube Previews Fixed</b> — Playing thumbnail hover-previews no longer triggers layout reflow loops or constant page flickering.' ] },
      { v: '5.2.1', icon: 'picture-in-picture', title: 'Video Restores and Fullscreen Fixed', hotfix: true, major: false, items: [
        '<b>Element Fullscreen Restored</b> — Double-clicking videos or clicking their fullscreen buttons now opens clean video views instead of rendering a black screen.',
        '<b>Smart Picture-in-Picture Exit</b> — Clicking the restore button in the top-right of the PiP floating window returns you directly to the original video tab.',
        '<b>No Background Audio Stays</b> — Clicking the Close ("X") button on the PiP window now pauses video playback and stops audio output, instead of resuming it in the background.' ] },
      { v: '5.2.0', icon: 'panel-right', title: 'The Right Edge, Respected', hotfix: true, major: false, items: [
        '<b>Pages Always Know Where Breeze Ends</b> — After opening or closing Nav, toggling the sidebar, or switching tabs, Breeze now verifies that every page agrees on the exact width of the web area and heals any mismatch on the spot, so sites no longer lay out past the visible right edge.',
        '<b>Stray Zoom, Snapped Back</b> — An accidental pinch or smart-zoom can no longer leave a page rendering oversized and clipped; Breeze re-asserts your intended zoom whenever the window chrome changes.' ] },
      { v: '5.1.10', icon: 'check-check', title: 'YouTube Posts, Unblocked', hotfix: true, major: false, items: [
        '<b>A Fix Only Where It Is Needed</b> — YouTube channel post pages now use WebKit\'s native site identity for their embedded Google account content, while Google and every other page keep Breeze\'s current versioned compatibility.' ] },
      { v: '5.1.9', icon: 'refresh-cw', title: 'WebKit, Up to Date', hotfix: true, major: false, items: [
        '<b>Current Site Compatibility</b> — Breeze now builds its browser identity from the WebKit and Safari version installed on your Mac instead of claiming an old fixed version, keeping modern sites styled and compatible as macOS updates.' ] },
      { v: '5.1.8', icon: 'panel-left', title: 'Sidebars in Step', hotfix: true, major: false, items: [
        '<b>Smooth from the First Frame</b> — Opening and closing the sidebar now keeps the page edge locked to the panel throughout the animation, eliminating the brief jump and repaint glitch.' ] },
      { v: '5.1.7', icon: 'check-check', title: 'System Theme, Fully in Sync', hotfix: true, major: false, items: [
        '<b>Every Color Changes Together</b> — When Breeze follows your Mac, switching macOS between Light and Dark now refreshes tabs, icons, the URL bar, backgrounds, and internal pages immediately—no hover or click needed.' ] },
      { v: '5.1.6', icon: 'panel-left', title: 'A Consistent Sidebar', hotfix: true, major: false, items: [
        '<b>Tabs Sit Right</b> — The docked sidebar now starts its tabs at the same height as split view, so the layout is consistent everywhere.',
        '<b>Both Favicons in Splits</b> — A split-pair row shows both pages\' icons together instead of just the active one.',
        '<b>Peek Matches Dock</b> — The hover-peek sidebar now uses your sidebar color and your saved docked width instead of a gray, oversized panel.' ] },
      { v: '5.1.5', icon: 'columns-2', title: 'Split View, Sorted', hotfix: true, major: false, items: [
        '<b>One Tab, Two Panes</b> — A split pair now shows as a single logical row in the sidebar instead of two duplicate entries, and clicking either pane just switches focus without rebuilding the layout.',
        '<b>Pinned Apps Stay Safe</b> — Splitting a pinned app clones it into a normal tab first, so rearranging or closing the split never disturbs the pin.',
        '<b>Steadier Divider</b> — The split divider keeps one stable ratio with sensible minimum pane widths while dragging and resizing.',
        '<b>Aligned Tabs</b> — Sidebar tabs in split view now start higher to line up with the lighter frame introduced in 5.1.4.' ] },
      { v: '5.1.4', icon: 'shapes', title: 'A Lighter, Smarter Frame', hotfix: true, major: false, items: [
        '<b>Fullscreen UI Freeze</b> — Breeze now pauses chrome refreshes and synthetic page reflows while WebKit owns fullscreen, protecting repeated video sessions.',
        '<b>Reliable Navigation</b> — New-tab and address-bar submissions reclaim stranded web views so pages no longer load invisibly into a stale container.',
        '<b>Location Permissions Work</b> — Sites can request location through Breeze with per-site choices and the real macOS Location Services prompt.',
        '<b>Compact Chrome</b> — A thinner, evenly spaced toolbar aligns its traffic lights, controls, and address pill into one clean band.',
        '<b>Floating Sidebar Peek</b> — Hovering the collapsed edge reveals a fast, animated teal-glass sidebar over the page without resizing it; docking still uses the saved width.',
        '<b>Theme and Corners Polished</b> — Dark colors and URL styling update immediately, while maximized windows retain rounded web corners.',
        '<b>Spectra by Default</b> — Breeze uses Spectra Search unless the user explicitly selects another engine.' ] },
      { v: '5.1.3', icon: 'picture-in-picture', title: 'Fullscreen Keeps Its Picture', hotfix: true, major: false, items: [
        '<b>Fullscreen Ownership Fixed</b> — Breeze now leaves a video view completely under WebKit\'s control while fullscreen, preventing the player from turning black after repeated entries.',
        '<b>Every Way In</b> — YouTube\'s fullscreen button, double-click, and the F key remain reliable across repeated enter-and-exit cycles.',
        '<b>Rounded Where It Belongs</b> — Normal browsing keeps Breeze\'s rounded content corners without clipping or interfering with fullscreen video.',
        '<b>Updates Relaunch Reliably</b> — Breeze now waits for the old process to fully exit before opening the newly installed version.' ] },
      { v: '5.1.2', icon: 'check-check', title: 'Tabs Move Again', hotfix: true, major: false, items: [
        '<b>Drag to Reorder Restored</b> — Sidebar tabs can be dragged into a new order again without sacrificing reliable first-click switching or close buttons.',
        '<b>Spectra\'s New Home</b> — Breeze now sends every Spectra search to <code>spectrasearch.info</code>.' ] },
      { v: '5.1.1', icon: 'picture-in-picture', title: 'Fullscreen Stays Visible', hotfix: true, major: false, items: [
        '<b>YouTube Fullscreen Fixed</b> — Fullscreen video no longer turns into a blank black or white surface when opened from YouTube\'s button, double-click, or the F key.',
        '<b>Reliable Re-entry</b> — Entering, exiting, and reopening fullscreen repeatedly now preserves WebKit\'s video layer instead of corrupting later attempts.' ] },
      { v: '5.1.0', icon: 'download', title: 'Downloads, Settled Down', hotfix: true, major: false, items: [
        '<b>One Download, One Row</b> — Progress updates now reconcile against each download\'s real ID instead of duplicating the list.',
        '<b>Smooth Progress</b> — Download updates are paced and rendered efficiently, eliminating the constant page stutter.',
        '<b>Cancel Means Cancel</b> — Cancelling updates the existing download cleanly instead of leaving repeated or broken rows behind.' ] },
      { v: '5.0.9', icon: 'volume-2', title: 'A Quieter, Roomier Breeze', major: false, items: [
        '<b>More Sounds, More Control</b> — Split view, closing split view, and pinning a site each have their own sound and independent Settings toggle.',
        '<b>Gentler by Default</b> — Added a 10% sound-volume option and made it the new default for everyone.',
        '<b>Room for Nav</b> — The sidebar now resets to its smallest width while remaining fully resizable, leaving more desktop-sized space beside Nav.',
        '<b>Smarter Media Controls</b> — Return to Tab now focuses the source tab first; press it again there to close Picture-in-Picture.',
        '<b>Quiet Pinned Apps</b> — Opening a pinned app no longer plays the new-tab sound.' ] },
      { v: '5.0.8', icon: 'volume-2', title: 'Breeze Finds Its Voice', major: false, items: [
        '<b>Purpose-Built Sounds</b> — New tabs, notifications, download starts, completed downloads, failed downloads, and page errors now each have their own polished Breeze sound.',
        '<b>Your Mix</b> — Turn every sound category on or off independently in Settings, with a shared 20%, 50%, 70%, or 100% volume control.',
        '<b>Working Download Links</b> — The fallback Breeze download page now points to the real versioned installer instead of a missing generic filename.' ] },
      { v: '5.0.7', icon: 'download', title: 'Images Open, Downloads Download', hotfix: true, major: false, items: [
        '<b>No More White Image Tabs</b> — Opening an image or media link in a new tab now displays it normally instead of leaving a blank, endlessly loading page.',
        '<b>Downloads, Not Guesswork</b> — Breeze now follows real download signals from links and servers instead of guessing from filenames, while explicit downloads continue to save normally.' ] },
      { v: '5.0.6', icon: 'check-check', title: 'Tabs on the First Click', hotfix: true, major: false, items: [
        '<b>One Click Means One Click</b> — Sidebar tabs now switch immediately when pressed, instead of occasionally needing two or three clicks.' ] },
      { v: '5.0.5', icon: 'picture-in-picture', title: 'PiP, Without the Interruption', hotfix: true, major: false, items: [

    const log = document.getElementById('log');
    const [latest, ...past] = RELEASES;

    if (latest.hotfix) {
      const hotfix = document.createElement('div');
      hotfix.className = 'hotfix-card';
      hotfix.innerHTML =
        `<div class="hotfix-icon">${ic(latest.icon)}</div>` +
        '<div class="hotfix-copy">' +
        `<div class="hotfix-meta"><span class="hotfix-pill">Hotfix</span><span class="hotfix-version">v${latest.v}</span></div>` +
        `<h2 class="hotfix-title">${latest.title}</h2>` +
        `<ul class="hotfix-list">${latest.items.map((i) => `<li>${i}</li>`).join('')}</ul></div>`;
      log.appendChild(hotfix);
    } else {
      // Feature releases get the large celebratory hero treatment.
      const hero = document.createElement('div');
      hero.className = 'hero';
      hero.innerHTML =
        '<div class="hero-orb o1"></div><div class="hero-orb o2"></div>' +
        `<div class="hero-icon">${ic(latest.icon)}</div>` +
        `<span class="hero-pill">Just landed · v${latest.v}</span>` +
        `<h2 class="hero-title">${latest.title}</h2>` +
        `<ul class="hero-list">${latest.items.map((i) => `<li>${i}</li>`).join('')}</ul>`;
      log.appendChild(hero);
    }

    const head = document.createElement('div');
    head.className = 'past-head';
    head.textContent = 'The road here';
    log.appendChild(head);

    function relElement(r) {
      const el = document.createElement('div');
      el.className = 'rel' + (r.major ? '' : ' minor');
      el.innerHTML =
        `<div class="ver"><span class="rel-icon">${ic(r.icon)}</span><b>v${r.v}</b>${r.major ? '<span class="tag">Major</span>' : ''}</div>` +
        `<div class="rel-copy"><h3>${r.title}</h3>` +
        `<ul>${r.items.map((i) => `<li>${i}</li>`).join('')}</ul></div>`;
      return el;
    }

    const visiblePast = past.slice(0, 5);
    const olderPast = past.slice(5);
    for (const r of visiblePast) {
      log.appendChild(relElement(r));
    }
    if (olderPast.length) {
      const older = document.createElement('details');
      older.className = 'older-releases';
      older.innerHTML = `<summary>Older releases <span>${olderPast.length} more</span></summary>`;
      for (const r of olderPast) {
        older.appendChild(relElement(r));
      }
      log.appendChild(older);
    }

    // Theme live updates
    if (window.breezeInternal) {
      const applyTheme = (t) => {
        const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      };
      applyTheme(breezeInternal.theme);
      breezeInternal.onTheme && breezeInternal.onTheme(applyTheme);
    }
  </script>
